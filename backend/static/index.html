<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMA AI Voice Agent</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .controls { margin-bottom: 20px; }
        button { padding: 10px 20px; font-size: 16px; margin-right: 10px; cursor: pointer; }
        #status { font-weight: bold; color: #333; margin-bottom: 10px; font-size: 18px; }
        #transcripts { margin-bottom: 20px; max-height: 200px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; border-radius: 5px; background: #fff; }
        .transcript { margin: 5px 0; padding: 8px; border-radius: 4px; }
        .user { background: #e1f5fe; text-align: right; color: #01579b; }
        .assistant { background: #e8f5e9; text-align: left; color: #1b5e20; }
        #log { background: #f4f4f4; padding: 15px; border-radius: 5px; height: 250px; overflow-y: auto; font-family: monospace; font-size: 12px; border: 1px solid #ddd; }
        h3 { border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 30px; }
    </style>
</head>
<body>
    <h1>Sunrise Medical VMA</h1>
    <div id="status">Idle</div>
    <div class="controls">
        <button id="startBtn" onclick="startCall()">Start Call</button>
        <button id="stopBtn" onclick="stopCall()" disabled>Stop Call</button>
    </div>
    
    <div id="transcripts"></div>
    
    <h3>Debug Log</h3>
    <div id="log"></div>

    <script>
        const WS_URL = (window.location.protocol === "https:" ? "wss://" : "ws://") +
            (window.location.host ? window.location.host : "localhost:8000") +
            "/ws/voice";

        let ws = null;
        let mediaStream = null;
        let audioContext = null;
        let sourceNode = null;
        let workletNode = null;
        let audioStarted = false;

        let playbackContext = null;
        let activeSources = [];
        let nextStartTime = 0;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusEl = document.getElementById('status');
        const logEl = document.getElementById('log');
        const transcriptsEl = document.getElementById('transcripts');

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.textContent = `[${time}] ${msg}`;
            logEl.prepend(entry);
            console.log(`[${time}] ${msg}`);
        }

        function setStatus(msg) {
            statusEl.textContent = msg;
        }

        function addTranscript(role, text) {
            const div = document.createElement('div');
            div.className = `transcript ${role}`;
            div.innerHTML = `<strong>${role === 'user' ? 'You' : 'Assistant'}:</strong> ${text}`;
            transcriptsEl.appendChild(div);
            transcriptsEl.scrollTop = transcriptsEl.scrollHeight;
        }

        async function startCall() {
            try {
                log("Requesting microphone permission...");
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                log("Microphone acquired.");

                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    log("WebSocket connected.");
                    ws.send(JSON.stringify({ type: "start", practice_id: 1 }));
                };

                ws.onmessage = handleServerMessage;

                ws.onerror = (e) => {
                    log("WebSocket error.");
                    setStatus("WebSocket error.");
                    console.error(e);
                };

                ws.onclose = (event) => {
                    log(`WebSocket closed: ${event.code}`);
                    setStatus("Call ended.");
                    cleanup();
                };

                startBtn.disabled = true;
                stopBtn.disabled = false;

            } catch (e) {
                log(`Failed to start call: ${e.message}`);
                setStatus("Failed to start call.");
            }
        }

        function stopCall() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "stop" }));
                ws.close();
            }
            cleanup();
        }

        function cleanup() {
            if (sourceNode) {
                sourceNode.disconnect();
                sourceNode = null;
            }
            if (workletNode) {
                workletNode.disconnect();
                workletNode = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            audioStarted = false;
            clearPlayback();
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
        }

        function handleServerMessage(event) {
            let msg;
            try {
                msg = JSON.parse(event.data);
            } catch (e) {
                log("Invalid server message.");
                return;
            }

            if (msg.type === "status") {
                setStatus(msg.message);
                log(`status: ${msg.message}`);
            }
            else if (msg.type === "ready") {
                setStatus("Ready. Speak naturally.");
                log(`ready: practice=${msg.practice_name} model=${msg.model}`);
                initAudioPipeline();
            }
            else if (msg.type === "audio_out") {
                enqueueAudio(msg.payload);
            }
            else if (msg.type === "transcript") {
                addTranscript(msg.role, msg.text);
            }
        }

        // --- AUDIO CAPTURE (MIC -> WEBSOCKET) ---
        
        // FIX: Removed the transferable list from postMessage to prevent DataCloneError
        const workletCode = `
            class PCMProcessor extends AudioWorkletProcessor {
                process(inputs, outputs, parameters) {
                    const input = inputs[0];
                    if (input && input.length > 0 && input[0].length > 0) {
                        // Pass a cloned Float32Array. DO NOT use [input[0]] as transfer list.
                        this.port.postMessage(new Float32Array(input[0]));
                    }
                    return true;
                }
            }
            registerProcessor("pcm-processor", PCMProcessor);
        `;

                        async function initAudioPipeline() {
            if (audioStarted) return;
            audioStarted = true;

            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: 16000
                });
            } catch (e) {
                log("Browser did not allow 16kHz AudioContext. Using default and downsampling.");
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (audioContext.state === "suspended") {
                await audioContext.resume();
            }

            const workletBlob = new Blob([workletCode], { type: "application/javascript" });
            const workletUrl = URL.createObjectURL(workletBlob);

            try {
                await audioContext.audioWorklet.addModule(workletUrl);
            } catch(e) {
                log("Failed to load AudioWorklet: " + e.message);
                return;
            }

            sourceNode = audioContext.createMediaStreamSource(mediaStream);
            workletNode = new AudioWorkletNode(audioContext, "pcm-processor");

            // 🔥 TWEAK THESE TWO NUMBERS TO FIX THE SENSITIVITY
            const START_SPEECH_THRESHOLD = 0.06; // Increase this if breathing interrupts the AI
            const STOP_SPEECH_THRESHOLD = 0.02;  // Must be lower than START to prevent flickering

            let isSpeaking = false;

            workletNode.port.onmessage = (event) => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;

                const float32 = event.data;
                
                // Calculate Root Mean Square (RMS) volume
                let sum = 0;
                for (let i = 0; i < float32.length; i++) {
                    sum += float32[i] * float32[i];
                }
                const rms = Math.sqrt(sum / float32.length);

                // Barge-In Logic with Hysteresis
                if (rms > START_SPEECH_THRESHOLD && !isSpeaking) {
                    console.log(`[VAD] User started speaking (RMS: ${rms.toFixed(3)}). Triggering Barge-In!`);
                    isSpeaking = true;
                    clearPlayback(); // Instantly stops the AI from speaking
                } 
                else if (rms < STOP_SPEECH_THRESHOLD && isSpeaking) {
                    isSpeaking = false; // User stopped speaking
                }

                const downsampled = downsampleBuffer(float32, audioContext.sampleRate, 16000);
                const pcm16 = floatTo16BitPCM(downsampled);
                const payload = arrayBufferToBase64(pcm16);

                ws.send(JSON.stringify({
                    type: "audio_in",
                    payload
                }));
            };

            sourceNode.connect(workletNode);
            log("Audio pipeline started.");
        }

        // --- AUDIO PLAYBACK (WEBSOCKET -> SPEAKERS) ---

        function ensurePlaybackContext() {
            if (!playbackContext) {
                playbackContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (playbackContext.state === "suspended") {
                playbackContext.resume();
            }
        }

        function clearPlayback() {
            for (const source of activeSources) {
                try { source.stop(); } catch (e) {}
            }
            activeSources = [];
            nextStartTime = 0;
        }

        function enqueueAudio(base64Payload) {
            ensurePlaybackContext();
            const int16 = base64ToInt16Array(base64Payload);
            const float32 = new Float32Array(int16.length);
            for (let i = 0; i < int16.length; i++) {
                float32[i] = int16[i] / 32768.0;
            }

            // Gemini Live outputs 24000 Hz audio
            const audioBuffer = playbackContext.createBuffer(1, float32.length, 24000);
            audioBuffer.copyToChannel(float32, 0);

            const source = playbackContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(playbackContext.destination);

            const now = playbackContext.currentTime;
            if (nextStartTime < now) {
                nextStartTime = now + 0.05;
            }

            source.start(nextStartTime);
            nextStartTime += audioBuffer.duration;
            activeSources.push(source);

            source.onended = () => {
                const idx = activeSources.indexOf(source);
                if (idx >= 0) activeSources.splice(idx, 1);
            };
        }

        // --- HELPER FUNCTIONS ---

        function downsampleBuffer(buffer, inputSampleRate, outputSampleRate) {
            if (outputSampleRate === inputSampleRate) return buffer;
            const ratio = inputSampleRate / outputSampleRate;
            const length = Math.round(buffer.length / ratio);
            const result = new Float32Array(length);
            let offsetResult = 0, offsetBuffer = 0;
            while (offsetResult < result.length) {
                const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
                let accum = 0, count = 0;
                for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
                    accum += buffer[i];
                    count++;
                }
                result[offsetResult] = accum / count;
                offsetResult++;
                offsetBuffer = nextOffsetBuffer;
            }
            return result;
        }

        function floatTo16BitPCM(input) {
            const output = new Int16Array(input.length);
            for (let i = 0; i < input.length; i++) {
                const s = Math.max(-1, Math.min(1, input[i]));
                output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            return output;
        }

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer.buffer || buffer);
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);
        }

        function base64ToInt16Array(base64) {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return new Int16Array(bytes.buffer);
        }
    </script>
</body>
</html>
